services:
  # ================= MYSQL =================
  mysql:
    image: mysql:8.4
    container_name: pbl4-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_pms}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./hotel_pms.sql:/docker-entrypoint-initdb.d/01-hotel_pms.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ================= BACKEND =================
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pbl4-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-hotel_pms}

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads

  # ================= FRONTEND =================
  frontend:
    build:
      context: ./pms-frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}

    container_name: pbl4-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
